{{define "content"}}
<h1>Create your account</h1>
<div class="card">
{{if .Error}}<p class="error">{{.Error}}</p>{{else}}
<p>You have been invited. Choose a username; you will add a passkey or authenticator app next.</p>
<form method="post" action="/register">
  <input type="hidden" name="code" value="{{.Data.Code}}">
  <label for="username">Username</label>
  <input id="username" name="username" required autocomplete="username" pattern="[a-z0-9][a-z0-9._-]{1,31}" autofocus>
  <label for="display_name">Display name</label>
  <input id="display_name" name="display_name" autocomplete="name" maxlength="64">
  <div class="actions"><button type="submit">Create account</button></div>
</form>
{{end}}
</div>
{{end}}
