version: "2"
linters:
  enable:
    - gosec
    - bodyclose
    - errorlint
    - misspell
    - unconvert
    - unparam
    - noctx
    - sqlclosecheck
    - rowserrcheck
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
formatters:
  enable:
    - gofmt
    - goimports
